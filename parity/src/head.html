<title>Optical Parity Chip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Eight input bits, one pass of light: a phase-encoded parity chip that cascades interference logic without electronics in between, simulated from its silicon photonic layout.">
<meta name="author" content="Atharv Dubey">
<meta name="theme-color" content="#0a1013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column. The live chip first (the eight sections are the input buttons, read left to right as the light travels),
   then why it cascades, what it costs, how fast, the chip and the notes.
   Same look as Bench to Pixel: a lab with the lights off. Red is light and optical phase, cyan is electrical data, amber marks heaters and thresholds. */
:root{
  --ink:#0a1013;
  --ink-2:#111a1e;
  --ink-3:#16232a;
  --line:#22313a;
  --fg:#e3ebed;
  --muted:#8b9ea5;
  --faint:#5d6f77;
  --petg:#eba340;
  --beam:#8fe3ff;
  --laser:#ff5a47;
  --good:#6fd9a2;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--fg);text-decoration-color:rgba(235,163,64,.7);text-underline-offset:3px}
a:hover{color:var(--petg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beam);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;gap:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.brand .t{color:var(--muted);font-weight:500}
.crumb{display:flex;gap:14px;flex-wrap:wrap;font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--petg)}
h1{font:700 clamp(30px,5.2vw,54px)/1.02 var(--f-display);font-variation-settings:"wdth" 82;letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:16ch}
h1 em{font-style:normal;color:var(--laser)}
h2{font:650 clamp(20px,2.4vw,26px)/1.15 var(--f-display);font-variation-settings:"wdth" 88;margin:0;text-wrap:balance}
h3{font:600 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.lede{max-width:68ch;color:var(--muted);margin:0;font-size:16.5px}
.lede strong{color:var(--fg);font-weight:500}
.hero{display:grid;gap:14px}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--ink-2);padding:18px;display:grid;gap:16px;min-width:0}
.cap{font:400 12px/1.45 var(--f-mono);color:var(--faint);margin:0}
.small{font-size:13.5px;color:var(--muted);margin:0;max-width:78ch}
.small strong{color:var(--fg);font-weight:500}
.lab{font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font:600 12px/1.4 var(--f-mono);letter-spacing:.02em}
.pill.ok{background:rgba(63,191,127,.14);color:var(--good)}
.pill.bad{background:rgba(255,90,71,.15);color:#ff8a7c}
.pill.warn{background:rgba(235,163,64,.15);color:var(--petg)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font:500 12.5px/1 var(--f-mono);color:var(--muted);background:var(--ink);font-variant-numeric:tabular-nums}
.seg label:hover{color:var(--fg)}
.seg input:checked+label{color:var(--ink);background:var(--fg);border-color:var(--fg)}
.seg input:focus-visible+label{outline:2px solid var(--beam);outline-offset:2px}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink-3);cursor:pointer;font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--petg);color:var(--petg)}
select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--fg);max-width:100%}
input[type=range]{width:100%;accent-color:var(--laser)}
.field{display:grid;gap:8px;min-width:0;align-content:start}
.row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}

/* the live chip */
.chiprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0;align-items:stretch}
.port{display:grid;align-content:center;gap:4px;padding-right:12px;font:500 11px/1.2 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right}
.port b{color:var(--laser);font-weight:600}
.arms{display:grid;gap:10px;min-width:0}
.secs{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;position:relative}
.secs::before{content:"";position:absolute;left:-12px;right:-12px;top:50%;height:2px;background:var(--laser);opacity:.55;z-index:0}
.sec{position:relative;z-index:1;display:grid;justify-items:center;gap:4px;padding:8px 2px 7px;border-radius:9px;border:1px solid var(--line);background:var(--ink);cursor:pointer;min-width:0}
.sec:hover{border-color:var(--petg)}
.sec .nm{font:500 10.5px/1 var(--f-mono);color:var(--faint);letter-spacing:.04em}
.sec b{font:700 20px/1 var(--f-mono);color:var(--faint)}
.sec[aria-pressed="true"]{border-color:var(--petg);background:linear-gradient(rgba(235,163,64,.09),rgba(235,163,64,.09)),var(--ink)}
.sec[aria-pressed="true"] b{color:var(--petg)}
.sec .ph{font:500 10.5px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sec svg{width:34px;height:34px;display:block}
.sec.bias{cursor:default;border-style:dashed}
.sec.bias:hover{border-color:var(--line)}
.ref{position:relative;display:flex;justify-content:center;font:500 11px/1 var(--f-mono);color:var(--faint);letter-spacing:.04em;padding:8px 0}
.ref::before{content:"";position:absolute;left:-12px;right:-12px;top:50%;height:2px;background:var(--laser);opacity:.55}
.ref span{position:relative;background:var(--ink-2);padding:0 10px}
.outs{display:grid;gap:10px;padding-left:12px;align-content:center;min-width:140px}
.lamp{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--ink)}
.lamp i{grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--laser);box-shadow:0 0 18px 4px rgba(255,90,71,.55)}
.lamp span{font:500 10.5px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lamp b{font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.answer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:end}
.big{font:700 clamp(30px,4.4vw,48px)/1 var(--f-display);font-variation-settings:"wdth" 80;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big .op{color:var(--muted);font-weight:500}
.big .res{color:var(--laser)}
.verdict{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* why it cascades */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--ink);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.card.badc{box-shadow:inset 0 2px 0 var(--faint)}
.card.goodc{box-shadow:inset 0 2px 0 var(--laser)}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card p strong{color:var(--fg);font-weight:500}
.card svg{width:100%;height:auto;display:block;max-width:420px}
.stat{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* charts */
.chart{width:100%;height:280px;display:block;border-radius:8px;background:var(--ink);border:1px solid var(--line);box-sizing:border-box;max-width:100%}
.ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px}
.read{display:flex;justify-content:space-between;font:500 12px/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.read b{color:var(--fg);font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts dt{font:500 11.5px/1.5 var(--f-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.facts dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.facts dd small{color:var(--muted);font-size:12.5px}
.speed{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px 26px;align-items:start}
.race{display:grid;gap:8px}
.racebar{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;font:500 12px/1.2 var(--f-mono);color:var(--muted)}
.racebar .tr{height:10px;border-radius:5px;background:var(--ink-3);position:relative;overflow:hidden}
.racebar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.racebar b{color:var(--fg);font-variant-numeric:tabular-nums}

/* chip + notes */
.chippic{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.chippic img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px}
.notes section{display:grid;gap:8px;align-content:start;min-width:0}
.notes p,.notes li{color:var(--muted);font-size:14.5px;margin:0}
.notes ul{margin:0;padding-left:18px;display:grid;gap:6px}
.notes strong{color:var(--fg);font-weight:500}
.src{font-size:13px;color:var(--faint)}
.src ol{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.src a{color:var(--muted)}
code{font:400 .9em var(--f-mono);color:var(--fg)}

@media (max-width:980px){
  .speed,.chippic{grid-template-columns:minmax(0,1fr)}
  .notes{grid-template-columns:minmax(0,1fr)}
  .ctl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .chiprow{grid-template-columns:minmax(0,1fr)}
  .port{text-align:left;padding:0 0 6px;grid-auto-flow:column;justify-content:start;gap:12px}
  .secs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .secs::before,.ref::before{display:none}
  .outs{padding:10px 0 0;grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .answer{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
